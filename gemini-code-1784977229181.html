<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Keuangan & Tabungan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💰 Kalkulator Keuangan</h2>
        
        <form id="financeForm">
            <div class="input-group">
                <label for="pemasukan">Total Pemasukan (Rp):</label>
                <input type="number" id="pemasukan" placeholder="Masukkan total pemasukan" required min="0">
            </div>

            <div class="input-group">
                <label for="pengeluaran">Total Pengeluaran (Rp):</label>
                <input type="number" id="pengeluaran" placeholder="Makan, tagihan, hiburan, dll" required min="0">
            </div>

            <div class="input-group">
                <label for="tabungan">Jumlah Menabung / Investasi (Rp):</label>
                <input type="number" id="tabungan" placeholder="Alokasi tabungan" required min="0">
            </div>

            <button type="button" onclick="hitungKeuangan()">Hitung Sekarang</button>
        </form>

        <div id="hasil" class="hasil-container" style="display: none;">
            <h3>📊 Ringkasan Laporan</h3>
            <div class="hasil-item">
                <span>Total Pemasukan:</span>
                <strong id="resPemasukan">Rp 0</strong>
            </div>
            <div class="hasil-item">
                <span>Total Pengeluaran:</span>
                <strong id="resPengeluaran">Rp 0</strong>
            </div>
            <div class="hasil-item">
                <span>Total Ditabung:</span>
                <strong id="resTabungan">Rp 0</strong>
            </div>
            <hr>
            <div class="hasil-item highlight">
                <span>Sisa Keuntungan / Saldo Bersih:</span>
                <strong id="resKeuntungan">Rp 0</strong>
            </div>
            <div class="hasil-item">
                <span>Margin Keuntungan:</span>
                <strong id="resMargin">0%</strong>
            </div>

            <div id="statusMessage" class="status"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
